# Недели 1–3: только postgres и redis. rabbitmq, kafka, clickhouse — с недели 4.

# Фиксируем имя: иначе каждый worktree поднимет свой стек на тех же портах.
name: thesis

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: thesis
      # Из окружения, а не литералом: репозиторий публичный, и пароль в нём не
      # должен ничего определять. Compose сам читает файл окружения из корня
      # проекта; образец значений — в env.example.
      #
      # Форма `:?` выбрана осознанно: без переменной compose падает с этим
      # текстом, а не поднимает базу с паролем, записанным в репозитории.
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?не задан — скопируйте env.example в рабочую копию}'
      POSTGRES_DB: thesis
      # Роль приложения: под ней работает сервис и действует RLS.
      APP_DB_ROLE: thesis_app
      APP_DB_PASSWORD: '${APP_DB_PASSWORD:?не задан — скопируйте env.example в рабочую копию}'
    ports: ['5432:5432']
    # С 18-й версии монтируется /var/lib/postgresql, не .../data:
    # данные лежат в подкаталоге по номеру версии, иначе образ не стартует.
    volumes:
      - 'pgdata:/var/lib/postgresql'
      # Роль приложения без BYPASSRLS. Скрипты из initdb.d выполняются только
      # при первой инициализации тома: существующему нужен down -v.
      - './docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U thesis -d thesis']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
